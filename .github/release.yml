# Release notes generated by GitHub (gh release create --generate-notes, see tools/release.sh):
# every pull request merged since the previous release, by label. The pull request title is the line in the notes.
changelog:
  exclude:
    labels:
      - skip-release-notes
  categories:
    - title: New features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Other changes
      labels:
        - "*"
